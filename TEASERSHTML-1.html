<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaser</title>
    <style>

        body {
            background-color: #000000;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;             
            box-sizing: border-box;
        }

        
        img {
            max-width: 600px;           
            max-height: 75vh;          
            width: auto;
            height: auto;
            object-fit: contain;        
            display: block;

    
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }


        @media (max-width: 600px) {
            body { padding: 20px; }
            img  { max-width: 100%; max-height: 80vh; }
        }
    </style>
</head>
<body>

    <img src="teaser1.png" alt="guessWho">
</body>
</html>
