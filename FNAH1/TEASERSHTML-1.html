<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaser</title>
    <style>
        /* Fondo negro y centrado perfecto */
        body {
            background-color: #000000;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;              /* Espacio alrededor de la imagen */
            box-sizing: border-box;
        }

        /* La imagen ahora tiene límites de tamaño */
        img {
            max-width: 600px;           /* Ancho máximo en píxeles */
            max-height: 75vh;           /* Nunca ocupará más del 75% del alto de la pantalla */
            width: auto;
            height: auto;
            object-fit: contain;        /* Mantiene la proporción sin recortar */
            display: block;

            /* Pequeño detalle "profesional": sombra suave y fade-in */
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Ajuste para pantallas pequeñas (móviles) */
        @media (max-width: 600px) {
            body { padding: 20px; }
            img  { max-width: 100%; max-height: 80vh; }
        }
    </style>
</head>
<body>
    <!-- Cambia "teaser.jpg" por el nombre de tu archivo -->
    <img src="teaser1.png" alt="guessWho">
</body>
</html>
